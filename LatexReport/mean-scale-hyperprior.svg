<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" role="img" aria-labelledby="title description">
  <title id="title">Mean and Scale Hyperprior</title>
  <desc id="description">A compact block diagram showing image and hyperlatent encoding, entropy parameters, decoding, and reconstruction.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1L9 5L1 9Z" fill="#374151"/>
    </marker>
    <marker id="dotted-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1L9 5L1 9Z" fill="#6b7280"/>
    </marker>
    <g id="bits">
      <rect width="10" height="12" fill="#4b5563" stroke="#4b5563"/>
      <rect x="10" width="10" height="12" fill="#fff" stroke="#4b5563"/>
      <rect x="20" width="10" height="12" fill="#4b5563" stroke="#4b5563"/>
      <rect x="30" width="10" height="12" fill="#4b5563" stroke="#4b5563"/>
      <rect x="40" width="10" height="12" fill="#fff" stroke="#4b5563"/>
      <rect x="50" width="10" height="12" fill="#4b5563" stroke="#4b5563"/>
    </g>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #1f2937; }
      .block { stroke-width: 1.2; }
      .label { font-size: 14px; }
      .signal { font-size: 12px; fill: #6b7280; }
      .flow { fill: none; stroke: #374151; stroke-width: 1.5; marker-end: url(#arrow); }
      .prior { fill: none; stroke: #6b7280; stroke-width: 1.5; stroke-dasharray: 3 3; marker-end: url(#dotted-arrow); }
    </style>
  </defs>

  <rect width="1000" height="440" fill="#fff"/>

  <!-- Analysis path -->
  <rect class="block" x="20" y="50" width="110" height="44" rx="8" fill="#fbe7c6" stroke="#d9a45b"/>
  <text class="label" x="75" y="72" text-anchor="middle" dominant-baseline="central">Input image</text>
  <rect class="block" x="170" y="50" width="100" height="44" rx="8" fill="#cfe0f7" stroke="#5b8bd0"/>
  <text class="label" x="220" y="72" text-anchor="middle" dominant-baseline="central">Encoder</text>
  <rect class="block" x="330" y="50" width="60" height="44" rx="8" fill="#d5efd0" stroke="#6aa860"/>
  <text class="label" x="360" y="72" text-anchor="middle" dominant-baseline="central">Q</text>
  <rect class="block" x="640" y="50" width="100" height="44" rx="8" fill="#cfe0f7" stroke="#5b8bd0"/>
  <text class="label" x="690" y="66" text-anchor="middle" dominant-baseline="central">Hyper</text>
  <text class="label" x="690" y="82" text-anchor="middle" dominant-baseline="central">encoder</text>
  <rect class="block" x="790" y="50" width="60" height="44" rx="8" fill="#d5efd0" stroke="#6aa860"/>
  <text class="label" x="820" y="72" text-anchor="middle" dominant-baseline="central">Q</text>

  <line class="flow" x1="132" y1="72" x2="168" y2="72"/>
  <text class="signal" x="150" y="62" text-anchor="middle">x</text>
  <line class="flow" x1="272" y1="72" x2="328" y2="72"/>
  <circle cx="300" cy="72" r="3" fill="#374151"/>
  <text class="signal" x="286" y="62" text-anchor="middle">y</text>
  <path class="flow" d="M300 72V24H690V48"/>
  <line class="flow" x1="742" y1="72" x2="788" y2="72"/>
  <text class="signal" x="765" y="62" text-anchor="middle">z</text>

  <!-- Main latent coding -->
  <line class="flow" x1="360" y1="96" x2="360" y2="138"/>
  <text class="signal" x="374" y="118">ŷ</text>
  <rect class="block" x="330" y="140" width="60" height="44" rx="8" fill="#f4c6b8" stroke="#d08572"/>
  <text class="label" x="360" y="162" text-anchor="middle" dominant-baseline="central">AE</text>
  <line class="flow" x1="360" y1="186" x2="360" y2="212"/>
  <use href="#bits" x="330" y="214"/>
  <line class="flow" x1="360" y1="228" x2="360" y2="264"/>
  <rect class="block" x="330" y="266" width="60" height="44" rx="8" fill="#f4c6b8" stroke="#d08572"/>
  <text class="label" x="360" y="288" text-anchor="middle" dominant-baseline="central">AD</text>

  <!-- Hyperlatent coding -->
  <line class="flow" x1="820" y1="96" x2="820" y2="138"/>
  <text class="signal" x="834" y="118">ẑ</text>
  <rect class="block" x="790" y="140" width="60" height="44" rx="8" fill="#f4c6b8" stroke="#d08572"/>
  <text class="label" x="820" y="162" text-anchor="middle" dominant-baseline="central">AE</text>
  <line class="flow" x1="820" y1="186" x2="820" y2="212"/>
  <use href="#bits" x="790" y="214"/>
  <line class="flow" x1="820" y1="228" x2="820" y2="264"/>
  <rect class="block" x="790" y="266" width="60" height="44" rx="8" fill="#f4c6b8" stroke="#d08572"/>
  <text class="label" x="820" y="288" text-anchor="middle" dominant-baseline="central">AD</text>

  <!-- Synthesis path -->
  <rect class="block" x="170" y="266" width="100" height="44" rx="8" fill="#cfe0f7" stroke="#5b8bd0"/>
  <text class="label" x="220" y="288" text-anchor="middle" dominant-baseline="central">Decoder</text>
  <rect class="block" x="20" y="266" width="110" height="44" rx="8" fill="#fbe7c6" stroke="#d9a45b"/>
  <text class="label" x="75" y="288" text-anchor="middle" dominant-baseline="central" font-size="13">Reconstruction</text>
  <rect class="block" x="640" y="266" width="100" height="44" rx="8" fill="#cfe0f7" stroke="#5b8bd0"/>
  <text class="label" x="690" y="282" text-anchor="middle" dominant-baseline="central">Hyper</text>
  <text class="label" x="690" y="298" text-anchor="middle" dominant-baseline="central">decoder</text>
  <rect class="block" x="430" y="256" width="160" height="64" rx="8" fill="#cfe0f7" stroke="#5b8bd0"/>
  <text class="label" x="510" y="277" text-anchor="middle" dominant-baseline="central">Entropy parameters</text>
  <text x="510" y="298" text-anchor="middle" dominant-baseline="central" font-size="12">N(μ, σ): mean &amp; scale</text>

  <line class="flow" x1="328" y1="288" x2="272" y2="288"/>
  <text class="signal" x="300" y="279" text-anchor="middle">ŷ</text>
  <line class="flow" x1="168" y1="288" x2="132" y2="288"/>
  <text class="signal" x="150" y="279" text-anchor="middle">x̂</text>
  <line class="flow" x1="788" y1="288" x2="742" y2="288"/>
  <text class="signal" x="765" y="279" text-anchor="middle">ẑ</text>
  <line class="flow" x1="638" y1="288" x2="592" y2="288"/>
  <text class="signal" x="615" y="279" text-anchor="middle">ψ</text>

  <!-- Distribution parameters guide arithmetic coding -->
  <line class="prior" x1="428" y1="288" x2="392" y2="288"/>
  <path class="prior" d="M480 254V162H392"/>

  <!-- Hyperlatent probability model -->
  <rect class="block" x="890" y="190" width="100" height="70" rx="8" fill="#f4c6b8" stroke="#d08572"/>
  <text class="label" x="940" y="212" text-anchor="middle" dominant-baseline="central">Factorized</text>
  <text class="label" x="940" y="228" text-anchor="middle" dominant-baseline="central">entropy</text>
  <text class="label" x="940" y="244" text-anchor="middle" dominant-baseline="central">model</text>
  <path class="prior" d="M940 188V162H852"/>
  <path class="prior" d="M940 262V288H852"/>

  <!-- Legend -->
  <rect x="20" y="364" width="16" height="16" rx="3" fill="#cfe0f7" stroke="#5b8bd0"/>
  <text x="44" y="372" dominant-baseline="central" font-size="12">Neural network</text>
  <rect x="170" y="364" width="16" height="16" rx="3" fill="#d5efd0" stroke="#6aa860"/>
  <text x="194" y="372" dominant-baseline="central" font-size="12">Quantizer</text>
  <rect x="290" y="364" width="16" height="16" rx="3" fill="#f4c6b8" stroke="#d08572"/>
  <text x="314" y="372" dominant-baseline="central" font-size="12">Arithmetic coder (AE / AD)</text>
  <line x1="580" y1="372" x2="612" y2="372" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="620" y="372" dominant-baseline="central" font-size="12">Probability parameters</text>
  <use href="#bits" x="790" y="366"/>
  <text x="858" y="372" dominant-baseline="central" font-size="12">Bitstream</text>

</svg>
